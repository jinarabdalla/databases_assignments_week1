<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <!-- Link to the external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1: Header Section -->
    <header id="main-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>
        <!-- Part 2: Add Expense Section -->
        <section id="add-expense-section" class="card">
            <h2>Add Expense</h2>
            
            <div class="input-group">
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" placeholder="e.g., Groceries">
            </div>

            <div class="input-group">
                <label for="expense-amount">Amount ($):</label>
                <input type="number" id="expense-amount" placeholder="0.00">
            </div>

            <div class="input-group">
                <label for="expense-category">Category:</label>
                <select id="expense-category">
                    <option value="" disabled selected>Select category</option>
                    <option value="food">Food</option>
                    <option value="transport">Transport</option>
                    <option value="utilities">Utilities</option>
                    <option value="entertainment">Entertainment</option>
                </select>
            </div>
        </section>

        <!-- Part 3: Your Expenses Placeholder Section -->
        <section id="your-expenses-section" class="card">
            <h2>Your Expenses</h2>
            <p class="placeholder-text">No expenses yet</p>
        </section>
    </main>

</body>
</html>
